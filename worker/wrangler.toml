# 施工工程日誌 API Worker
# Secrets 不寫在這裡，請用：npx wrangler secret put <名稱> [--env test]
#   PIN_ADMIN, PIN_WORKER, TOKEN_SECRET, GAS_SHARED_SECRET, GAS_URL

name = "engineering-log-api"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://ethanchen1216.github.io"

[[durable_objects.bindings]]
name = "LOGIN_LIMITER"
class_name = "LoginLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LoginLimiter"]

# ── 測試環境：連到測試用 GAS（備份試算表），另允許本機測試頁 ──
[env.test]
name = "engineering-log-api-test"

[env.test.vars]
ALLOWED_ORIGINS = "https://ethanchen1216.github.io,http://localhost:8765"

[[env.test.durable_objects.bindings]]
name = "LOGIN_LIMITER"
class_name = "LoginLimiter"

[[env.test.migrations]]
tag = "v1"
new_sqlite_classes = ["LoginLimiter"]
